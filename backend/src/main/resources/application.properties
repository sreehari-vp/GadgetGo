spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:./backend/.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:${spring.profiles.active:}}

spring.application.name=gadgetgo-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gadgetgo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.provisioning.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

springdoc.swagger-ui.path=/swagger-ui.html
